 # Soviet Union

    SOV_Joseph_Stalin_desc: "The Man of Europe - His common name upon the streets of Europe and even far across the regions of the Soviet Empire; A Conquerer.\nJoseph Stalin is a brutal dictator who has managed to control more territory than the German Empire, or even the vast territories of the Mongolian Hordes of Genghis Khan - A true Stalinist believer in the struggle of a Global Social Order under the Soviet Union of Socialist Republics.\n\nMany people fear the reach of the NKVD and actively suppress various movements across the homeland under the direct orders of Joseph Stalin."

 # East Prussia

    PRU_Haselstadt_desc: "A man of humble decent thrusted into power by the Soviet Government with the instructed purpose of promoting Prussian identitism and foster a seperation of the Germanic-Prussian cultural bond."

 # West Prussia

    WPR_Mikhail_Sidorenko_desc: "Mikhail Sidorenko is Ukrainian-born Pro-Prussian nationalist placed on the governing body of the West Prussian State with a clear desire of unifying West and East Prussia into a unified Socialist State with Prussian Nationalist traits to establish a dominant Anti-German position in Europe - Though it is unclear if this is within the desires of Joseph Stalin as it currently stands."

 # USG - North Africa

    USG_Maxwell_D_Taylor_desc: "Taylor was appointed Director of North African Affairs in the late 1940s to secure the Sahel-Sahara belt against communist infiltration but has struggled lately due to Communist Infiltrators."
 
# ISR

    ISR_Meir_Vilner_desc: "Meir Vilner rose to prominence as the Soviet Union's most reliable Jewish political operative during the postwar reorganization of the Middle East. A Lithuanian-born Marxist and lifelong member of the Communist Party of Israel, Vilner was selected by Moscow to lead the relocation of Israeli populations to the newly established Israeli Soviet within the Sinai Peninsula—part of a broader strategy to dissolve nationalist tensions and integrate the region into the Soviet-backed Levantine order.\n\nAs Director of the Israeli Soviet and chief architect of the Arabian-Israeli Pact of Socialist Values (PARV-SOV), Vilner oversees a tightly controlled socialist state built on joint administration between Arab and Israeli cadres. He maintains a fragile balance between Arab national ambitions, Israeli administrative authority, and Moscow's strategic directives.\n\nVilner's technocratic approach, ideological reliability, and ethnic neutrality make him a convenient instrument for Soviet planners. However, his growing influence over the regional political structure and security apparatus has begun to draw scrutiny from Moscow. While his authority remains unchallenged within PARV-SOV, his long-term ambitions are increasingly viewed as a potential liability by the Soviet leadership."


 # Hungary

    HUN_Laszlo_Maro_desc: "Laszlo Maro; A hero of the Hungarian people - Once a revolutionary soldier turned reluctant administrator, Laszlo Maro emerged as an unexpected political force in the fractured remains of Soviet Hungary. Known for his unapologetically blunt rhetoric and firm nationalist convictions, Maro rose to power not through party politics, but by denouncing them outright. His disdain for entrenched political elites—both past and present—resonated with a population disillusioned by decades of corruption, repression, and foreign dependency.\n\nThough nominally aligned with the Soviet bloc, Maro's leadership has grown increasingly antagonistic toward Moscow. Officially anti-Soviet but not anti-socialist, he advocates a uniquely Hungarian path: statist, sovereign, and uncompromising. His vocal support for Ukrainian autonomy and regional resistance movements has further strained his position within the Communist Party, leaving many to label him a “traitor in waiting.”\n\nCritics call him temperamental, even reckless—but for a generation tired of puppets and profiteers, Maro represents something rare in post-war Europe: a man who cannot be bought, and will not be silenced. His growing cult of personality and escalating provocations suggest a confrontation with the Soviet command is not a matter of if but when - Though he now actively opposes the Soviet Government in secret while claiming to support all Soviet systems leading to a very likely conflict in the coming times."

 # Italy

    ITA_socialist_council_desc: "The Italian Socialist Council is a five-member ruling body composed of prominent pro-Soviet Italian figures who dominate the political landscape of postwar Italy. The council governs under the nominal supervision of Moscow, but internal fractures, ideological disputes, and a collapsing national unity have rendered its authority increasingly precarious.\n\n§YLuigi Longo§! serves as the council's de facto leader and primary liaison with the Soviet Union, maintaining the ideological line set by his predecessor, Togliatti. §YPietro Secchia§!, a staunch hardliner, oversees internal security and Party discipline, orchestrating widespread purges and suppressing dissent with ruthless efficiency. §YCarlo Levi§!, an intellectual and former anti-fascist, manages cultural and public messaging efforts, often clashing with other members over his moderate leanings. §YUmberto Terracini§!, the council’s legal architect, handles constitutional matters and the façade of republican governance. Finally, §YMauro Scoccimarro§!, a Party economist and doctrinaire Marxist, is tasked with planning and directing the state-controlled economy.\n\nDespite their shared loyalty to the socialist cause, deep ideological divisions, growing unrest, and the rise of nationalist, monarchist, and separatist factions threaten to tear the council—and Italy—apart."

 # American-European Occupation Zone

    USE_Lucius_D_Clay_desc: "A decorated general and wartime planner, Lucius D. Clay was selected by §YPresident Lindbergh§! for his reputation of administrative discipline and clarity to lead the American-European Occupation Zone following the partition of the continent. A devout believer in the liberal democratic as well as the moral superiority of democracy and free-market capitalism, §YClay§! views Soviet communism not just as an ideological enemy, but as an existential threat to Western civilization. Unlike his contemporaries, §YClay§! does not hide behind rhetoric.\n\nWhile he claims to support freedom on political expressioin - He is a realist—a pragmatist—who believes that democracy must prove its worth not just through ideals, but through results; He is willing to make hard decisions from suppressing radical political activity to overseeing controversial integration programs - all under the guiding belief that the survival of liberty in Europe depends on American resolve.\n\nTo some, §YClay§! is the last line of defense against totalitarianism. To others, he is an occupying general ruling with a velvet gauntlet.\n\n§YGeneral Lucius D. Clay§! governs with a firm hand and a clear objective: contain Soviet expansion, stabilize the European theater, and prepare the continent for democratic self-governance—on American terms."
